name: Run autotests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Select tests to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - unit
          - integration

jobs:
  run-tests:
    runs-on: ubuntu-latest
    name: Tests (${{ inputs.deployment_target }})
    steps:
      - name: Copy source code
        uses: actions/checkout@v4

      - name: Set up Python env
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # Диагностика: сразу видим, что за система и где мы
      - name: Show environment
        run: |
          python --version
          pwd
          ls -la

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run tests
        run: |
          TARGET="${{ inputs.deployment_target }}"
          if [ "$TARGET" = "unit" ]; then
            python -m pytest tests/unit -v
          elif [ "$TARGET" = "integration" ]; then
            python -m pytest tests/integration -v
          else
            echo "Running all tests..."
            python -m pytest -v
          fi


     
