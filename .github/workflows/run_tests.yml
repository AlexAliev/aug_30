name: Run autotests

on:
  workflow_dispatch:
    inputs:
      deployment_target:
        description: "Select tests to run"
        required: true
        type: choice
        default: all
        options:
          - all
          - unit
          - integration

jobs:
  run-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.10
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      # ВАЖНО: этот шаг должен быть и выполняться
      - name: Install dependencies from requirements.txt
        run: pip install -r requirements.txt

      # Диагностика: сразу видно, есть ли selenium
      - name: Check installed packages
        run: pip list | grep -i selenium || echo "selenium NOT found"

      # Проверка импорта (теперь должна пройти)
      - name: Verify pages import
        run: python -c "from pages.homepage import HomePage; print('Import OK')"

      - name: Run pytest
        run: python -m pytest -v


     
